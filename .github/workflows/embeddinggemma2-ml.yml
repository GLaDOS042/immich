name: EmbeddingGemma 2 ML

on:
  workflow_dispatch:
  push:
    branches:
      - feature/embeddinggemma2-migraphx
  pull_request:
    paths:
      - machine-learning/**
      - .github/workflows/embeddinggemma2-ml.yml

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: machine-learning

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install uv==0.8.15

      - name: Install ML dependencies
        run: uv sync --locked --extra cpu --group dev

      - name: Ruff
        run: uv run ruff check immich_ml/models/embedding_gemma2.py immich_ml/pipeline.py immich_ml/config.py test_embedding_gemma2.py

      - name: Mypy
        run: uv run mypy --strict immich_ml/models/embedding_gemma2.py immich_ml/pipeline.py test_embedding_gemma2.py

      - name: Unit tests
        run: uv run pytest -q test_embedding_gemma2.py
